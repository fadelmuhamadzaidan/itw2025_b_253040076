<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Power Rangers</h1>
    <div class="container">
      <ul class="gallery">
        <li>
          <a href="#gambar-1">
            <img src="img/thumbs/putih.jpg" alt="Power Rangers white" />
            <span>White</span>
          </a>
          <div class="overlay" id="gambar-1">
            <a href="#" class="close">x close</a>
            <a href="#gambar-4" class="prev"> prev </a>
            <img src="img/full/putih.jpg" alt="full" />
            <a href="#gambar-2" class="next"> next </a>
          </div>
        </li>
        <li>
          <a href="#gambar-2">
            <img src="img/thumbs/kuning.jpg" alt="Power Rangers Yellow" />
            <span>Yellow</span>
          </a>
          <div class="overlay" id="gambar-2">
            <a href="#" class="close">x close</a>
            <a href="#gambar-1" class="prev"> prev </a>
            <img src="img/full/kuning.jpg" alt="full" />
            <a href="#gambar-3" class="next"> next </a>
          </div>
        </li>
        <li>
          <a href="#gambar-3">
            <img src="img/thumbs/ungu.jpg" alt="Power Rangers Purple" />
            <span>Purple</span>
          </a>
          <div class="overlay" id="gambar-3">
            <a href="#" class="close">x close</a>
            <a href="#gambar-2" class="prev"> prev </a>
            <img src="img/full/ungu.jpg" alt="full" />
            <a href="#gambar-4" class="next"> next </a>
          </div>
        </li>
        <li>
          <a href="#gambar-4">
            <img src="img/thumbs/biru.jpg" alt="Power Rangers Blue" />
            <span>Blue</span>
          </a>
          <div class="overlay" id="gambar-4">
            <a href="#" class="close">x close</a>
            <a href="#gambar-3" class="prev"> prev </a>
            <img src="img/full/biru.jpg" alt="full" />
            <a href="#gambar-1" class="next"> next </a>
          </div>
        </li>
        <div class="clear"></div>
      </ul>
    </div>
  </body>
</html>
